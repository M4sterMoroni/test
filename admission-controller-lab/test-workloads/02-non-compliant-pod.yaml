apiVersion: v1
kind: Pod
metadata:
  name: non-compliant-nginx
  namespace: default
  labels:
    app: nginx
    test: non-compliant
spec:
  containers:
  - name: nginx
    image: nginx:1.14  # Old vulnerable version
    ports:
    - containerPort: 80
    securityContext:
      privileged: true  # Security risk
      runAsUser: 0      # Running as root

